    @media(max-width:760px){.page{padding-top:28px}.intro{margin-bottom:22px}.rewards{grid-template-columns:1fr}.reward{border-radius:22px;padding:8px 8px 23px}.card-image{border-radius:17px}.cta{margin-top:18px;width:84%}}@media(prefers-reduced-motion:reduce){.cta,.cta::before{animation:none}.cta{transition:none}}
