<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#caefff">
  <title>Exclusive Welcome Rewards</title>
  <style>
    *{box-sizing:border-box}html{background:#c9efff}body{margin:0;min-height:100svh;font-family:Inter,Arial,sans-serif;color:#08244d;background:linear-gradient(135deg,#bceaff 0,#e8f9ff 48%,#b5e6fb 100%)}
    .page{width:min(1180px,100%);margin:auto;padding:clamp(28px,5vw,64px) clamp(16px,4vw,44px) 48px}.eyebrow{text-align:center;margin:0 0 8px;font-size:12px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:#1766ad}h1{text-align:center;margin:0;font-size:clamp(32px,5vw,60px);line-height:1;color:#061d45;letter-spacing:-.04em;text-transform:uppercase}h1 span{color:#1670c8}.intro{text-align:center;max-width:640px;margin:14px auto 30px;color:#315b82;font-size:clamp(14px,1.6vw,18px);line-height:1.55}
    .rewards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,3vw,34px)}.reward{display:flex;flex-direction:column;align-items:center;padding:10px 10px 26px;border:1px solid #fff9;border-radius:28px;background:#ffffff42;box-shadow:0 18px 50px #2d789526;backdrop-filter:blur(8px)}.card-image{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:22px;box-shadow:0 14px 30px #08295745}
    .cta{width:min(82%,410px);margin-top:20px;border:3px solid #fff2a7;border-radius:999px;padding:17px 24px;background:linear-gradient(180deg,#ffe98a 0,#ffc62e 48%,#f3a715 100%);color:#101d38;font-size:clamp(16px,1.8vw,21px);font-weight:950;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;box-shadow:0 5px 0 #9e6700,0 12px 22px #ab730044;transition:transform .18s ease,filter .18s ease}.cta:hover{transform:translateY(-2px);filter:brightness(1.06)}.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #9e6700}.cta:focus-visible{outline:4px solid #1268bf;outline-offset:4px}.fineprint{text-align:center;margin:26px auto 0;max-width:760px;color:#447294;font-size:11px;line-height:1.5}
    @media(max-width:760px){.page{padding-top:28px}.intro{margin-bottom:22px}.rewards{grid-template-columns:1fr}.reward{border-radius:22px;padding:8px 8px 23px}.card-image{border-radius:17px}.cta{margin-top:17px;width:86%}}@media(prefers-reduced-motion:reduce){.cta{transition:none}}
  </style>
  <script>
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init','1073411772195649');fbq('track','PageView');
  </script>
</head>
<body>
  <noscript><img height="1" width="1" style="display:none" alt="" src="https://www.facebook.com/tr?id=1073411772195649&amp;ev=PageView&amp;noscript=1"></noscript>
  <main class="page">
    <p class="eyebrow">Exclusive Welcome Rewards</p><h1>Choose Your <span>Reward</span></h1><p class="intro">Two rewards for new members. Select your reward below to get started.</p>
    <section class="rewards" aria-label="Available rewards">
      <article class="reward"><img class="card-image" src="assets/reward-free-rm20.png" alt="Free RM20 new member reward"><button class="cta" type="button" data-reward="free-rm20">Get Free RM20</button></article>
      <article class="reward"><img class="card-image" src="assets/reward-kyc-rm10.png" alt="RM10 reward for completing KYC"><button class="cta" type="button" data-reward="kyc-rm10">Complete KYC &amp; Get RM10</button></article>
    </section>
    <p class="fineprint">Rewards are subject to eligibility and applicable campaign terms. KYC verification is required for the RM10 reward.</p>
  </main>
  <script>
  document.querySelectorAll('.cta').forEach(function(button){button.addEventListener('click',function(){var destination='https://4dlotto88.com/my/register';var nextTab=window.open('about:blank','_blank');if(typeof fbq==='function')fbq('track','CompleteRegistration',{reward:button.dataset.reward});setTimeout(function(){if(nextTab){nextTab.location.href=destination}else{window.location.href=destination}},1500)})});
  </script>
</body>
</html>
